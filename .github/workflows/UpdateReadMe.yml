name: UpdateReadMe

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

permissions: 
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: UpdateReadMe
        run : python scripts/updaate_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "chore: auto-update README [skip ci]"
          git push
          
